name: lexaudit-dev

services:
  # B1 qəbul meyarı: `docker compose up` → API açılır → GET /admin/health cavab verir
  api:
    build: .
    container_name: lexaudit-api
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      APP_ENV: development
      BIND_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://lexaudit:lexaudit_dev@postgres:5432/lexaudit
      # Yalnız lokal dev üçün; real mühitdə secret manager-dən gəlir
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (>= 32 chars) in .env}
      CSRF_SECRET: ${CSRF_SECRET:?set CSRF_SECRET (>= 32 chars) in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      AUTO_MIGRATE: 'true'
      PROMETHEUS_LISTEN_ADDR: 0.0.0.0:9090
      S3_ENDPOINT: http://minio:9000
      S3_REGION: eu-central-1
      S3_BUCKET: lexaudit-dev
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      # Antivirus: `docker compose --profile av up` + CLAMAV_HOST=clamav (dev-də boş = söndürülüb)
      CLAMAV_HOST: ${CLAMAV_HOST:-}
      MODEL_SERVING_BASE_URL: ${MODEL_SERVING_BASE_URL:-}
      MODEL_SERVING_API_KEY: ${MODEL_SERVING_API_KEY:-}
      # Demo məlumat: ayrı "Demo MMC" şirkəti (admin|accountant|approver|viewer@demo.lexaudit.local).
      # Defolt parol YALNIZ lokal dev üçündür; ictimai deploy-da .env ilə mütləq dəyişin.
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Demo-Passw0rd-2026}
      # Python RAG/OCR sidecar: set both URL and token, or leave both empty.
      RAG_OCR_BASE_URL: ${RAG_OCR_BASE_URL:-}
      RAG_OCR_TOKEN: ${RAG_OCR_TOKEN:-}
    ports:
      - '8080:8080'

  postgres:
    image: pgvector/pgvector:pg16
    container_name: lexaudit-postgres
    environment:
      POSTGRES_USER: lexaudit
      POSTGRES_PASSWORD: lexaudit_dev
      POSTGRES_DB: lexaudit
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lexaudit']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: lexaudit-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5

  # §11: antivirus (clamd). İmzalar ilk açılışda yüklənir (bir neçə dəqiqə, ~1 GB RAM) → profile ilə seçimlidir.
  clamav:
    image: clamav/clamav:stable
    container_name: lexaudit-clamav
    profiles: ['av']
    ports:
      - '3310:3310'
    healthcheck:
      test: ['CMD', '/usr/local/bin/clamdcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  # Connectivity-only echo stub. It DOES NOT implement model inference or /v1 contracts.
  # Opt in with --profile model-stub; never use it as MODEL_SERVING_BASE_URL.
  model-serving:
    image: hashicorp/http-echo:latest
    profiles: ['model-stub']
    container_name: lexaudit-model-serving-stub
    command: ['-listen=:8001', '-text=model-serving dev stub']
    ports:
      - '8001:8001'

volumes:
  pgdata:
  miniodata:
